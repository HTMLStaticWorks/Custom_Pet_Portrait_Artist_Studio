<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" fill="none">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE8667" />
      <stop offset="50%" stop-color="#C46849" />
      <stop offset="100%" stop-color="#9E482C" />
    </linearGradient>
    <style>
      .logo-brand { fill: #C46849; }
      .logo-sub { fill: #1E1714; font-weight: 800; }
      @media (prefers-color-scheme: dark) {
        .logo-sub { fill: #FAF5F0; }
      }
    </style>
  </defs>
  <!-- Artistic Palette & Paw Icon -->
  <g transform="translate(4, 5)">
