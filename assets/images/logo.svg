    <path d="M20 2C9.5 2 1 10.5 1 21c0 8.3 5.7 15.3 13.5 17.2 1.2.3 2.5-.6 2.5-1.9v-1.8c0-2.2 1.8-4 4-4h2.5c4.7 0 8.5-3.8 8.5-8.5 0-1.5-.4-2.9-1.1-4.1C36.8 9.5 29 2 20 2z" fill="url(#terracottaGrad)" opacity="0.95"/>
    <!-- Palette thumb hole -->
    <circle cx="9" cy="27" r="3.2" fill="#FAF6F0"/>
    <!-- Color dabs / Paw pads inside palette -->
    <circle cx="15" cy="11" r="2.2" fill="#FAF6F0"/>
    <circle cx="21" cy="9" r="2.2" fill="#FAF6F0"/>
    <circle cx="27" cy="12" r="2.2" fill="#FAF6F0"/>
    <!-- Artist Brush -->
    <path d="M28 28L38 38M36 36l3-3a1.5 1.5 0 012.1 2.1l-3 3-2.1-2.1z" stroke="#C46849" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Studio Text with Enhanced Prominent Slogan -->
  <text x="48" y="26" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" class="logo-brand" letter-spacing="0.5">PawVinci</text>
  <text x="49" y="41" font-family="'DM Sans', -apple-system, sans-serif" font-size="10" font-weight="800" class="logo-sub" letter-spacing="2.2">PET PORTRAIT ATELIER</text>
