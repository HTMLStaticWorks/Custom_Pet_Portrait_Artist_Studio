<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 50" width="250" height="50" fill="none">
  <defs>
    <!-- Toe 1: Luminous Atelier Sage Gradient -->
    <linearGradient id="toeSageGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9BC4AB" />
      <stop offset="100%" stop-color="#67917A" />
    </linearGradient>
    <linearGradient id="toeSageDarkD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#557C66" />
      <stop offset="100%" stop-color="#365343" />
    </linearGradient>

    <!-- Toe 2: Radiant Golden Amber Gradient -->
    <linearGradient id="toeAmberGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCA68" />
      <stop offset="100%" stop-color="#F29C49" />
    </linearGradient>
    <linearGradient id="toeAmberDarkD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE822E" />
      <stop offset="100%" stop-color="#BA5F18" />
    </linearGradient>

    <!-- Toe 3: Warm Terracotta Gradient -->
    <linearGradient id="toeTerraGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA9773" />
      <stop offset="100%" stop-color="#DE6E49" />
    </linearGradient>
    <linearGradient id="toeTerraDarkD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD512E" />
      <stop offset="100%" stop-color="#98391A" />
    </linearGradient>

    <!-- Toe 4: Rust / Burnt Sienna Gradient -->
    <linearGradient id="toeRustGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E27753" />
      <stop offset="100%" stop-color="#B84E2C" />
    </linearGradient>
    <linearGradient id="toeRustDarkD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C3A1C" />
      <stop offset="100%" stop-color="#73250D" />
    </linearGradient>

    <!-- Palm Pad Stepped Gradients for Dark Theme -->
    <linearGradient id="padLayer1Dark" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#EAA186" />
      <stop offset="60%" stop-color="#D36B48" />
      <stop offset="100%" stop-color="#A94729" />
    </linearGradient>
    <linearGradient id="padLayer2Dark" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#B85231" />
      <stop offset="100%" stop-color="#88331C" />
    </linearGradient>
    <linearGradient id="padLayer3Dark" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#7A2B18" />
      <stop offset="100%" stop-color="#55190D" />
    </linearGradient>
    <linearGradient id="padLayer4Dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B150D" />
      <stop offset="100%" stop-color="#220E09" />
    </linearGradient>
    <linearGradient id="padCoreSageDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9BC4AB" />
      <stop offset="100%" stop-color="#67917A" />
    </linearGradient>

    <filter id="stickerShadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Layered Papercut Paw Icon Emblem -->
  <g transform="translate(3, 2.5)">
