      C 38.5 20.5 41.5 24.5 40.5 30.5 C 39.5 36.5 35.5 41.5 31.5 42
      C 27.5 42.5 25.5 40.5 25 40.5 C 24.5 40.5 22.5 42.5 18.5 42
      C 14.5 41.5 10.5 36.5 9.5 30.5 C 8.5 24.5 11.5 20.5 17 20.5 Z
    " fill="url(#iconPadL1)" />

    <path d="
