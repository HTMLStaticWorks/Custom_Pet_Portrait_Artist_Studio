    " fill="url(#iconPadL3)" filter="url(#iconInnerCut)" />

    <path d="
      M 21 28 C 22.8 28 23.8 29 25 29 C 26.2 29 27.2 28 29 28
      C 31.8 28 33 30 32.5 33 C 32 35.8 30 37.2 28 37.4
      C 26.2 37.6 25.4 36.5 25 36.5 C 24.6 36.5 23.8 37.6 22 37.4
      C 20 37.2 18 35.8 17.5 33 C 17 30 18.2 28 21 28 Z
    " fill="url(#iconPadL4)" />

    <path d="
      M 22.5 30.5 C 23.8 30.5 24.5 31.2 25 31.2 C 25.5 31.2 26.2 30.5 27.5 30.5
      C 29.2 30.5 30 31.8 29.6 33.8 C 29.2 35.5 27.8 36.4 26.5 36.5
      C 25.5 36.6 25 35.8 25 35.8 C 25 35.8 24.5 36.6 23.5 36.5
      C 22.2 36.4 20.8 35.5 20.4 33.8 C 20 31.8 20.8 30.5 22.5 30.5 Z
